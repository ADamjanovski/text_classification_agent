[project]
name = "backend"
version = "0.1.0"
description = "Backend for serving our text classification app"
readme = "README.md"
requires-python = "==3.12.3"
dependencies = [
    "fastapi==0.136.3",
    "ml_code",
    "motor==3.7.1",
    "pymongo==4.17.0",
    "uvicorn==0.49.0",
]

[tool.uv.sources]
ml_code = { path = "../src", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
