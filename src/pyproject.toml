[project]
name = "ml_code"
version = "0.1.0"
description = "Package to run our model definitions, data retrieval and helper functions."
readme = "README.md"
requires-python = "==3.12.3"
dependencies = [
    "kagglehub==1.0.2",
    "matplotlib==3.10.9",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "scikit-learn==1.9.0",
    "seaborn==0.13.2",
    "sentence-transformers==5.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml_code"] 
